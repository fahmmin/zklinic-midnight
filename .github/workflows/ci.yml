name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Install Compact compiler
        run: |
          curl --proto '=https' --tlsv1.2 -LsSf https://github.com/midnightntwrk/compact/releases/latest/download/compact-installer.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Compile the Compact contract (technical gate)
        run: |
          compact update 0.36.1
          compact compile --skip-zk contract/src/zkclinic.compact /tmp/zkclinic-compiled

      - run: npm run build -w contract
      - run: npm run typecheck
      - name: Tests (contract simulator, CLI, UI, API)
        run: npm test
